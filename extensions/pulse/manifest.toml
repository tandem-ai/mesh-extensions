id = "mesh/pulse"
version = "0.1.0"
api = "1.2"
kind = "wasm"
scope = "org"
description = "An org's pulse: a server part that counts the minutes and keeps the last webhook in the org's store."

[server]
every = ["1m"]
webhook = true

[[contributes.agent_tools]]
name = "ticks"
description = "How many minutes the org's pulse has counted, and the last webhook it got."

[permissions]
store = true
server = true
