[workspace]
resolver = "3"
members = [
  "sdk/rust",
  "providers/claude-code",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
mesh-ext = { path = "sdk/rust" }
extism-pdk = "1.4"
serde = { version = "1", features = ["derive"] }
# Keys keep their order, as agents' config files have them.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
